<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>الانضمام إلى مجموعة | سياحة الأردن</title>
<link rel="stylesheet" href="style.css">
<style>
.ok{text-align:center}
.ok .big{font-size:3rem}
.ok .btn{margin:14px 6px 0}
.chk{display:flex;gap:8px;align-items:flex-start}
.chk input{width:auto;margin-top:8px}
</style>

</head>
<body>
<header>
  <a href="index.html" class="logo">دَرْب <span>Darb</span></a>
  <button class="menu-toggle" aria-label="القائمة" aria-expanded="false">☰</button>
  <nav aria-label="القائمة الرئيسية"><ul><li><a href="index.html">الرئيسية</a></li><li><a href="explore.html">استكشف</a></li><li><a href="trips.html">الرحلات</a></li><li><a href="match.html">اكتشف مجموعتك</a></li><li><a href="community.html" class="active" aria-current="page">المجتمع</a></li><li><a href="feedback.html">آراء الزوار</a></li></ul></nav>
</header>
<main class="page">
  <section class="hero"><h1>الانضمام إلى مجموعة</h1><p id="sub">أكمل بياناتك لتصلك ترتيبات الرحلات والتحديثات.</p></section>
  <section class="card" id="box">
    <div class="form" id="form">
      <div class="full"><label for="g">المجموعة</label><select id="g"></select></div>
      <div><label for="n">الاسم الكامل</label><input id="n" maxlength="40" autocomplete="name"></div>
      <div><label for="e">البريد الإلكتروني</label><input id="e" type="email" dir="ltr" autocomplete="email"></div>
      <div><label for="p">رقم الهاتف (اختياري)</label><input id="p" type="tel" dir="ltr" autocomplete="tel"></div>
      <div><label for="l">مستوى الخبرة</label><select id="l"><option>مبتدئ</option><option>متوسط</option><option>متمرس</option></select></div>
      <div class="full"><label for="m">لماذا تريد الانضمام؟</label><textarea id="m" rows="3" maxlength="300"></textarea></div>
      <div class="full chk"><input id="a" type="checkbox"><label for="a">أوافق على احترام قواعد المجموعة وعدم نشر محتوى مسيء.</label></div>
      <div class="full"><button class="btn accent" id="go" type="button">تأكيد الانضمام</button></div>
    </div>
  </section>
</main>
<div id="toast" role="status"></div>
<script src="script.js"></script>
<script>
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2400)}
const base=window.DARB_GROUPS.map(g=>[g.id,g.name]);
const extra=JSON.parse(get('extra')||'[]').map(x=>[x.id,x.name]);
const all=base.concat(extra);
const sel=document.getElementById('g');
sel.innerHTML=all.map(([i,n])=>`<option value="${i}">${esc(n)}</option>`).join('');
const want=new URLSearchParams(location.search).get('g');
if(want&&all.some(x=>x[0]==want))sel.value=want;
document.getElementById('go').onclick=()=>{
  const n=document.getElementById('n').value.trim(),e=document.getElementById('e').value.trim();
  if(!n){toast('أدخل اسمك');return}
  if(!/^\S+@\S+\.\S+$/.test(e)){toast('أدخل بريداً إلكترونياً صحيحاً');return}
  if(!document.getElementById('a').checked){toast('يجب الموافقة على قواعد المجموعة');return}
  const id=+sel.value,name=sel.options[sel.selectedIndex].text;
  const joined=new Set(JSON.parse(get('joined')||'[]'));joined.add(id);set('joined',JSON.stringify([...joined]));
  const reqs=JSON.parse(get('requests')||'[]');
  reqs.push({group:id,name:n,email:e,phone:document.getElementById("p").value,level:document.getElementById("l").value,msg:document.getElementById("m").value,time:Date.now()});set('requests',JSON.stringify(reqs));
  document.getElementById('box').innerHTML=`<div class="ok"><div class="big">🎉</div><h2>أهلاً بك يا ${esc(n)}</h2><p>تم انضمامك إلى «${esc(name)}».</p><a class="btn" href="community.html">العودة إلى المجموعات</a><a class="btn accent" href="feedback.html">شارك تجربتك</a></div>`};
</script>
</body>
</html>
