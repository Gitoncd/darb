<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حجز مقعد | دَرْب</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a href="index.html" class="logo">دَرْب <span>Darb</span></a>
  <button class="menu-toggle" aria-label="القائمة" aria-expanded="false">☰</button>
  <nav aria-label="القائمة الرئيسية"><ul><li><a href="index.html">الرئيسية</a></li><li><a href="explore.html">استكشف</a></li><li><a href="trips.html" class="active" aria-current="page">الرحلات</a></li><li><a href="match.html">اكتشف مجموعتك</a></li><li><a href="community.html">المجتمع</a></li><li><a href="feedback.html">آراء الزوار</a></li></ul></nav>
</header>
<main class="container">
  <div class="card booking-card">
    <h2>📝 حجز مقعد في الرحلة</h2>
    <form id="bf" novalidate><div class="form" style="grid-template-columns:1fr">
      <div><label for="trip">الرحلة</label><select id="trip"></select></div>
      <div><label for="fullname">الاسم الكامل</label><input type="text" id="fullname" placeholder="أدخل اسمك الثلاثي" autocomplete="name" required></div>
      <div><label for="phone">رقم الهاتف</label><input type="tel" id="phone" dir="ltr" placeholder="07XXXXXXXX" autocomplete="tel" required></div>
      <div><label for="email">البريد الإلكتروني</label><input type="email" id="email" dir="ltr" placeholder="example@domain.com" autocomplete="email" required></div>
      <div><label for="seats">عدد المقاعد</label><select id="seats"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
      <p class="notice">سنتواصل معك عبر الهاتف أو الواتساب لتأكيد الحجز وطريقة الدفع. لا تُدخل بيانات بطاقة الائتمان هنا.</p>
      <div>
  <label>إضافات للرحلة (اختياري)</label>
  <label style="display:flex;align-items:center;gap:10px;font-weight:400;margin-bottom:6px">
    <input type="checkbox" class="addon" value="guide" data-price="15" style="width:auto;margin:0"> 🧭 مرشد سياحي (+15 د.أ)
  </label>
  <label style="display:flex;align-items:center;gap:10px;font-weight:400;margin-bottom:6px">
    <input type="checkbox" class="addon" value="photo" data-price="20" style="width:auto;margin:0"> 📸 مصور (+20 د.أ)
  </label>
  <label style="display:flex;align-items:center;gap:10px;font-weight:400;margin-bottom:6px">
    <input type="checkbox" class="addon" value="car" data-price="25" style="width:auto;margin:0"> 🚗 سيارة خاصة (+25 د.أ)
  </label>
</div>
      <button type="submit" class="btn accent">إرسال طلب الحجز</button>
    </div></form>
  </div>
</main>
<div id="toast" role="status"></div>
<script src="script.js"></script>
<script>
/* تعبئة الرحلات: سكربت عادي منفصل، يشتغل حتى لو تعطل Firebase */
(function () {
  var sel = document.getElementById('trip');
  sel.innerHTML = Object.keys(DARB_TRIPS).map(function (k) {
    var t = DARB_TRIPS[k];
    return '<option value="' + k + '">' + t.title + ' — ' + t.date + '</option>';
  }).join('');
  var want = new URLSearchParams(location.search).get('trip');
  if (DARB_TRIPS[want]) sel.value = want;
})();
</script>
<script type="module">
import { db } from "./firebase.js";
import { collection, addDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const $ = id => document.getElementById(id);
const sel = $('trip');
const boxes = document.querySelectorAll('.addon');


function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2400); }

$('bf').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('fullname').value.trim(), ph = $('phone').value.trim().replace(/[\s-]/g, ''), em = $('email').value.trim();
  if (name.split(/\s+/).length < 2) { toast('أدخل اسمك الكامل'); return; }
  if (!/^07[789]\d{7}$/.test(ph)) { toast('أدخل رقم هاتف أردني صحيح (07XXXXXXXX)'); return; }
  if (!/^\S+@\S+\.\S+$/.test(em)) { toast('أدخل بريداً إلكترونياً صحيحاً'); return; }

  const btn = e.target.querySelector('button[type="submit"]');
  const picked = [...boxes].filter(b => b.checked);
const addons = picked.map(b => b.value);
const addonsTotal = picked.reduce((s, b) => s + +b.dataset.price, 0);
  btn.disabled = true;
  try {
    await addDoc(collection(db, 'bookings'), {
      tripId: sel.value,
      tripTitle: DARB_TRIPS[sel.value].title,
      name, phone: ph, email: em,
      seats: +$('seats').value,
      addons, addonsTotal,
      createdAt: serverTimestamp()
    });
    location.href = 'confirmation.html?trip=' + sel.value + '&seats=' + $('seats').value + '&name=' + encodeURIComponent(name) + '&addons=' + addons.join(',');
  } catch (err) {
    console.error(err);
    toast('تعذّر إرسال الحجز، حاول مرة ثانية');
    btn.disabled = false;
  }
});
</script>
</body></html>
