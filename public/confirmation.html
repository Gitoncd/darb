<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تم استلام طلب الحجز | دَرْب</title>
<link rel="stylesheet" href="style.css">
<style>
.confirm-card{max-width:550px;margin:50px auto;text-align:center;padding:40px 30px}
.check-icon{font-size:4rem;margin-bottom:15px}
.confirm-card h2{justify-content:center;font-size:2rem}
.confirm-card p{color:#555;margin-bottom:20px;font-size:1.1rem}
.whatsapp-box{background:#25D366;color:#fff;padding:15px 20px;border-radius:12px;display:inline-block;text-decoration:none;font-weight:700;margin-bottom:26px;transition:transform .2s}
.whatsapp-box:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<header>
  <a href="index.html" class="logo">دَرْب <span>Darb</span></a>
  <button class="menu-toggle" aria-label="القائمة" aria-expanded="false">☰</button>
  <nav aria-label="القائمة الرئيسية"><ul><li><a href="index.html">الرئيسية</a></li><li><a href="explore.html">استكشف</a></li><li><a href="trips.html" class="active" aria-current="page">الرحلات</a></li><li><a href="match.html">اكتشف مجموعتك</a></li><li><a href="community.html">المجتمع</a></li><li><a href="feedback.html">آراء الزوار</a></li></ul></nav>
</header>
<main class="container">
  <div class="card confirm-card">
    <div class="check-icon" aria-hidden="true">✅</div>
    <h2>تم استلام طلب حجزك!</h2>
    <p id="sum">شكراً لك. سنتواصل معك قريباً لتأكيد الحجز.</p>
    <!-- TODO: استبدلوا الرابط برابط مجموعة الواتساب الحقيقي -->
    <a href="https://chat.whatsapp.com/exampleGroupLink123" target="_blank" rel="noopener" class="whatsapp-box">💬 الانضمام لمجموعة الواتساب الخاصة بالرحلة</a>
    <div><a href="index.html" class="btn-primary">العودة للصفحة الرئيسية</a></div>
  </div>
</main>
<script src="script.js"></script>
<script>
const p=new URLSearchParams(location.search),t=DARB_TRIPS[p.get('trip')],n=(p.get('name')||'').trim();
if(t)document.getElementById('sum').textContent='شكراً '+(n||'لك')+'. استلمنا طلب حجز '+(+p.get('seats')||1)+' مقعد في «'+t.title+'» ('+t.date+'). سنتواصل معك لتأكيد الحجز وطريقة الدفع.';
</script>
